[package]
name = "lanbaz"
version = "0.6.2"
description = "LanBaz - open source LAN gaming network"
authors = ["LanBaz contributors"]
edition = "2021"
rust-version = "1.77"

# The library target is what the mobile entry points use; on desktop the same
# code is driven from main.rs.
[lib]
name = "lanbaz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"

[features]
# Enabled by tauri-build when bundling for production.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
